<!DOCTYPE html>
<html lang="tr">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="description" content="Günlük, haftalık ve aylık gelir gider takibi">
  <meta name="theme-color" content="#F4F3FB" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14141C" media="(prefers-color-scheme: dark)">

  <!-- iPhone: open full screen from the home screen -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Ay Sonu">
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Ay Sonu</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; height: 100%; background: #F4F3FB; }
    @media (prefers-color-scheme: dark) { html, body { background: #14141C; } }
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #6A5AE8; transition: opacity .3s ease;
    }
    #splash img { width: 88px; height: 88px; border-radius: 22px;
      box-shadow: 0 10px 30px rgba(106, 90, 232, .25); }
    #splash .name { font-size: 20px; font-weight: 800; }
    #splash .bar { width: 120px; height: 4px; border-radius: 4px;
      background: rgba(106, 90, 232, .15); overflow: hidden; }
    #splash .bar::after { content: ""; display: block; width: 40%; height: 100%;
      border-radius: 4px; background: #6A5AE8; animation: slide 1.1s ease-in-out infinite; }
    @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
  </style>
</head>
<body>
  <div id="splash">
    <img src="icons/apple-touch-icon.png" alt="">
    <div class="name">Ay Sonu</div>
    <div class="bar"></div>
  </div>
  <script>
    // Hide the loading screen once Flutter draws its first frame.
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (!s) return;
      s.style.opacity = '0';
      setTimeout(function () { s.remove(); }, 350);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
